name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.CICD_TOKEN }}
          release-type: go
