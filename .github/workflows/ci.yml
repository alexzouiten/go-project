name: ci

on:
  push:
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build test image
        run: docker build --target base --tag go-ci-test:base .

      - name: Run tests
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/app"
          --workdir /app
          go-ci-test:base
          make test-cicd
